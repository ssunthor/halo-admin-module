- version: 0.1.6
  date: "2026-08-11"
  author: "Martin Kecka"
  changes:
    - category: "✨ New Features & Enhancements"
      items:
        - "Identity Unification: Migrated identity tracking from legacy first names to unified full names for all GitOps release, retry, and delete operations. Identity is now securely resolved via the new `X-Forwarded-Full-Name` header."
        - "Added capability to delete feature branches and container tags directly from the GitOps Project UI."
        - "Introduced a dedicated 'Audit' tab in the GitOps Project Details Dialog to view the full, project-wide Git audit history, complete with searchable telemetry and pagination."
        - "Implemented a collapsed 'Inactive / Deleted Releases' accordion at the bottom of the GitOps tab to display historical native releases that have been deleted."
    - category: "🚀 Architecture & Infrastructure"
      items:
        - "Updated the `get_current_user` FastAPI dependency to extract and serve the new `X-Forwarded-Full-Name` header payload provided by the GIA Gateway."
        - "Engineered the `/api/gitops/delete` REST endpoint to orchestrate GitOps deletions and auto-clear Redis cache topologies (`ham:gitops:inventory` and `ham:gitops:audit`) for synchronous UI updates."

- version: 0.1.5
  date: "2026-08-10"
  author: "Martin Kecka"
  changes:
