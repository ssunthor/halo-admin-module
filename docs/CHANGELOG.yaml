# ---------------------------------------------------------------------------
# HALO ADMIN MODULE (HAM) - CHANGELOG
#
# NOTE FOR CONTRIBUTORS:
# Please add the tag `[NEEDS_DOCS]` to the end of any item
# that introduces a significant change to logic, architecture, or
# core functionality. This serves as a reminder to update the
# main `ham_design.md` document to reflect the change.
#
# STANDARD CATEGORIES:
# - "🚀 Architecture & Infrastructure"
# - "✨ New Features & Enhancements"
# - "🎨 UI / UX Improvements"
# - "🐛 Bug Fixes & Resilience"
# - "🔒 Security & Auth"
# - "🧹 Refactoring & Chores"
# ---------------------------------------------------------------------------
- version: 0.2.5
  date: "2026-09-25"
  author: "Martin Kecka"
  changes:
    - category: "✨ New Features & Enhancements"
      items:
        - "Created the foundational External API framework (`/api/external`), complete with a dedicated Swagger UI at `/api/ham/docs` and an independent `openapi.json` definition."
        - "Implemented the `/external/tenants` endpoint to provide a lightweight index of all tenants, and `/external/tenants/{acronym}` with an `expand=True` parameter to fetch full, paginated device topologies."
        - "Added the `/external/config` and `/external/config/{acronym}` endpoints utilizing the new HRU `GetTenantConfigs` proxy to serve config histories and backup statistics instantly without loading heavy device metadata."
        - "Built an intelligent file delivery system via `/external/download/{hash}` that securely serves textual (`.conf`, `.xml`) and Base64-encoded binary (`.tgz`) configuration files using a Redis-backed 7-day TTL map, completely obfuscating internal file paths."

- version: 0.2.4
  date: "2026-09-25"
  author: "Martin Kecka"
  changes:
    - category: "🚀 Architecture & Infrastructure"
      items:
        - "Implemented a stale-while-revalidate Redis caching strategy for the repository topology, enabling instant UI rendering with background polling to HRU."
    - category: "✨ New Features & Enhancements"
      items:
        - "Implemented the `Repository` tab to act as a direct consumer of the Halo Repository Utility (HRU) gRPC service."
        - "Added a dedicated `hru_connector.py` client and REST API proxy routes in `repository.py`."
        - "Added multi-dimensional filtering to the repository dashboard, allowing dynamic search across Tenant, Device Name, Site Code, Status, IP mapping, and Configuration states."
        - "Introduced client-side column sorting and component pagination restricted to 250 rows to heavily optimize DOM rendering performance."
    - category: "🎨 UI / UX Improvements"
      items:
        - "Deployed a unified, flat `RepositoryDashboard` layout containing all repository devices for high-density visibility."
        - "Designed a compact grid layout for the `DeviceDetailsDialog`, aligning with standard ecosystem aesthetic guidelines."
        - "Integrated interactive JSON tooltips within the dialog to expose raw CMD Audit Data (Segment and GNID parameters)."
        - "Added conditional status chips highlighting missing IPs, missing configurations, and failed CMD audits."

