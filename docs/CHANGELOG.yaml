- version: 0.1.4
  date: "2026-08-07"
  author: "Martin Kecka"
  changes:
    - category: "✨ New Features & Enhancements"
      items:
        - "Updated the `ProjectGitOpsTab` component to retrieve and display the `Branch Updated` timestamp from the backend for better release timeline tracking."
    - category: "🎨 UI / UX Improvements"
      items:
        - "Refactored GitOps project layout to strictly isolate and nest 'Main' and 'Dev' core environments, placing their respective branch and historical release containers logically under a single environment group."
        - "Added 'Branch' and 'Container' badge tags to GitOps items and introduced visual tree indentation for nested release containers to clarify the component hierarchy."
    - category: "🐛 Bug Fixes & Resilience"
      items:
        - "Fixed a bug in `ProjectGitOpsTab` where the target branch was hardcoded to `master` when promoting from `dev`; it now correctly targets `main`."
        - "Fixed a bug in GitOps author attribution where the system incorrectly fell back to the branch's original author (or `gia-ai`) instead of tracking the logged-in user who actually triggered the release action. It now explicitly maps `user.display_name` or `user.username`."

- version: 0.1.3
